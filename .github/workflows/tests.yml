# Build the C engine and run the unit tests. Real-data tests skip (dataset not
# in the repo); benchmarks are excluded by the default pytest markers.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake ninja-build
      - name: Build C engine
        # Portable build; -march=native only matters for local benchmarks.
        run: python scripts/build_engine.py --no-native
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
